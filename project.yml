name: WClock
options:
  bundleIdPrefix: com.jacobmoe
  deploymentTarget:
    iOS: "17.0"
targets:
  WClock:
    type: application
    platform: iOS
    sources:
      - path: WClock
        excludes: ["WClock.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobmoe.wclock
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: UVCVP9M6QB
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: WClock
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to show the local weather and sunrise/sunset times."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
